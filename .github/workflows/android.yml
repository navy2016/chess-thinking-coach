name: android-ci

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
      pull-requests: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace > /tmp/test_out.txt 2>&1
          code=$?
          cat /tmp/test_out.txt
          exit $code

      - name: Report test failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report_test_failures.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-$(git rev-parse --short HEAD)"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "三棋思考教练 $TAG" \
            --notes "自建 APK（debug 签名）。手机浏览器直接下载后安装即可；如提示未知来源，允许安装即可。落子前替你推演，落子后讲给你听。"
